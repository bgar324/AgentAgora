[project]
name = "agora"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bertopic>=0.17.4",
    "dspy>=3.3.0",
    "fastapi[standard]>=0.136",
    "hdbscan>=0.8.44",
    "httpx>=0.28.1",
    "numpy>=2.0,<2.4",
    "openai>=2.54.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "supabase>=2.24.0",
    "umap-learn>=0.5.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agora"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "ruff>=0.15.0",
]
